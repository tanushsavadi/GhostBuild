[project]
name = "ghostbuild"
version = "0.1.0"
description = "GhostBuild — core, contracts, knowledge and asset tooling (integrations/* are separate uv projects)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "pyyaml",
    "orjson",
    "numpy",
    "pillow",
    "httpx",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]
knowledge = ["pymupdf", "anthropic"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = [".", "core", "pi"]
asyncio_mode = "auto"
