<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>GhostBuild</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #0d1512;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app {
        display: flex;
        min-height: 100%;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .gb { width: 100%; max-width: 480px; text-align: left; }
      .gb h1 { font-size: 20px; margin: 0 0 4px; }
      .gb .sub { color: #8A8A8A; margin: 0 0 16px; }
      .gb dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 20px; font-size: 13px; }
      .gb dt { color: #8A8A8A; }
      .gb dd { margin: 0; word-break: break-all; }
      .gb label { display: block; color: #8A8A8A; font-size: 12px; margin-bottom: 4px; }
      .gb input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 0; background: rgba(255,255,255,0.08); color: #fff; font-size: 14px; }
      .gb button { margin-top: 10px; padding: 10px 14px; border: 0; border-radius: 8px; background: #b2f5c7; color: #0d1512; font-weight: 600; }
      .gb .primary { display: block; padding: 14px 16px; margin: 24px 0 12px; background: #b2f5c7; color: #0d1512; text-align: center; text-decoration: none; border-radius: 12px; font-weight: 650; }
      .gb details { border-top: 1px solid #2b3b33; margin-top: 20px; padding-top: 16px; }
      .gb summary { cursor: pointer; font-weight: 600; padding: 4px 0 12px; }
      .gb details p { color: #a9bcb1; }
      .gb :is(a, button, input, summary):focus-visible { outline: 2px solid #b2f5c7; outline-offset: 4px; }
      .gb .msg { color: #8A8A8A; font-size: 12px; min-height: 16px; }
    </style>
  </head>
  <body>
    <div id="app">GhostBuild is running. Check the glasses display.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
